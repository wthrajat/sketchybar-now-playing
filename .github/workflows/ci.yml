name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- --deny warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: tag matches Cargo.toml
        run: |
          test "${GITHUB_REF#refs/tags/v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: stage package
        run: |
          root="sketchybar-now-playing-${{ matrix.target }}"
          mkdir -p "$root/bin" "$root/plugins" "$root/items"
          install -m 755 "target/${{ matrix.target }}/release/sketchybar-now-playing" "$root/bin/"
          install -m 644 plugins/now_playing.sh "$root/plugins/"
          install -m 644 items/now_playing.sh items/now_playing.lua "$root/items/"
          install -m 644 config.example.toml README.md LICENSE "$root/"
          tar -czf "$root.tar.gz" "$root"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: sketchybar-now-playing-*.tar.gz
          if-no-files-found: error

  github-release:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "${GITHUB_REF#refs/tags/}" dist/*.tar.gz --title "${GITHUB_REF#refs/tags/}" --generate-notes

  crates-io:
    needs: github-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
